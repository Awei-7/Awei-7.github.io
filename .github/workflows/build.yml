name: Build blog

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate local assets
        run: npm run check:assets

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: blog-public
          path: public
          retention-days: 7
